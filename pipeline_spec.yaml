# ==============================================================================
# NiFi 拓撲宣告規格：極簡監控測試管線 (Mock Pipeline)
# 依據《新人任務 - 監控》章節規範：GenerateFlowFile -> LogAttribute
# ==============================================================================
pipeline_name: "Test_Mock_Pipeline"

processors:
  # 節點 A：高頻產生帶有 JSON Payload 的測試 FlowFile (每 2 秒 1 筆)
  - name: "Generate_Mock_Data"
    type: "org.apache.nifi.processors.standard.GenerateFlowFile"
    scheduling_strategy: "TIMER_DRIVEN"
    scheduling_period: "2 sec"
    config:
      schedulingPeriod: "2 sec"
      schedulingStrategy: "TIMER_DRIVEN"
    properties:
      "File Size": "128B"
      "Batch Size": "1"
      "Data Format": "Text"
      "Unique FlowFiles": "false"
      "Custom Text": '{"sensor": "youbike_station_sim", "status": "ACTIVE", "flow_rate": 1, "test_ts": "${now()}"}'
    auto_terminate_relationships: []
    autoTerminatedRelationships: []

  # 節點 B：接收端，印出屬性與內容，出口自動終止 (Auto-Terminate)
  - name: "Log_Payload"
    type: "org.apache.nifi.processors.standard.LogAttribute"
    scheduling_strategy: "TIMER_DRIVEN"
    scheduling_period: "0 sec"
    config:
      schedulingPeriod: "0 sec"
      schedulingStrategy: "TIMER_DRIVEN"
    properties:
      "Log Level": "info"
      "Log Payload": "true"
      "Attributes to Log": ""
    auto_terminate_relationships:
      - "success"
    autoTerminatedRelationships:
      - "success"

connections:
  # 主要連線：節點 A 的 success 連接至節點 B
  - source: "Generate_Mock_Data"
    destination: "Log_Payload"
    relationships:
      - "success"
    back_pressure_object_threshold: 1000
    back_pressure_data_size_threshold: "10 MB"
    backPressureObjectThreshold: 1000
    backPressureDataSizeThreshold: "10 MB"