name: Archive TDX Raw Data to Disk

on:
  schedule:
    # 每個 5 分鐘自動執行一次 (包含半點、整點)
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      force_station:
        description: '強制重新抓取今日靜態站位 (True/False)'
        required: false
        default: 'false'
        type: boolean

jobs:
  archive-to-disk:
    runs-on: self-hosted
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Fetch TDX and Save Raw JSON
        shell: python
        run: |
          import os
          import sys
          import json
          import time
          import datetime
          import urllib.request
          import urllib.parse
          import glob
          import ssl

          # -------------------------------------------------------------
          # 0. 解決 Python 3.13 / 企業網路 SSL 憑證檢查失敗
          # -------------------------------------------------------------
          ssl_ctx = ssl._create_unverified_context()

          client_id = "ltmc.liao-89a1f100-a9ac-47ab"
          client_secret = "13a86ee7-314e-47a8-ac77-ffeb2f5660bd"
          force_station = "${{ github.event.inputs.force_station }}" == "true"

          os.makedirs("data", exist_ok=True)
          token_cache_path = os.path.join("data", "token_cache.json")

          # -------------------------------------------------------------
          # 1. Token 智慧管理 (24小時只換發一次)
          # -------------------------------------------------------------
          token = None
          now_ts = time.time()

          if os.path.exists(token_cache_path):
              try:
                  with open(token_cache_path, "r", encoding="utf-8") as f:
                      cache = json.load(f)
                      if cache.get("expires_at", 0) > now_ts + 600:
                          token = cache.get("access_token")
                          remaining_hours = (cache["expires_at"] - now_ts) / 3600
                          print(f"[1/3] 沿用有效 Token (剩餘有效時間: {remaining_hours:.1f} 小時)")
              except Exception as e:
                  print(f"快取讀取異常，重新向 TDX 申請: {e}")

          if not token:
              print("[1/3] 向 TDX 申請全新 24 小時 Token (已略過企業 SSL 憑證檢驗)...")
              token_url = "https://tdx.transportdata.tw/auth/realms/TDX/protocol/openid-connect/token"
              payload = urllib.parse.urlencode({
                  "grant_type": "client_credentials",
                  "client_id": client_id,
                  "client_secret": client_secret
              }).encode("utf-8")
              
              req = urllib.request.Request(
                  token_url,
                  data=payload,
                  headers={"Content-Type": "application/x-www-form-urlencoded"}
              )
              with urllib.request.urlopen(req, timeout=15, context=ssl_ctx) as resp:
                  token_data = json.loads(resp.read().decode("utf-8"))
                  token = token_data["access_token"]
                  expires_in = token_data.get("expires_in", 86400)
                  
                  with open(token_cache_path, "w", encoding="utf-8") as f:
                      json.dump({
                          "access_token": token,
                          "expires_at": now_ts + expires_in,
                          "updated_at": datetime.datetime.now().isoformat()
                      }, f, indent=2)
                  print("  -> 全新 Token 申請成功並已寫入本地快取。")

          # -------------------------------------------------------------
          # 2. 時間與目錄計算 (台北時間 UTC+8)
          # -------------------------------------------------------------
          now_utc8 = datetime.datetime.now(datetime.timezone.utc).astimezone(datetime.timezone(datetime.timedelta(hours=8)))
          date_str = now_utc8.strftime("%Y-%m-%d")
          time_str = now_utc8.strftime("%Y%m%d_%H%M")

          def fetch_and_write(category, api_url, filename_prefix):
              print(f"[*] 正在抓取 TDX {category}...")
              api_req = urllib.request.Request(
                  api_url,
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/json"
                  }
              )
              with urllib.request.urlopen(api_req, timeout=20, context=ssl_ctx) as r:
                  raw_data = r.read()

              target_dir = os.path.join("data", "raw", category, date_str)
              os.makedirs(target_dir, exist_ok=True)
              file_path = os.path.join(target_dir, f"{filename_prefix}_{time_str}.json")

              with open(file_path, "wb") as f:
                  f.write(raw_data)

              records_count = len(json.loads(raw_data.decode("utf-8")))
              file_size_kb = os.path.getsize(file_path) / 1024
              print(f"  [✓] {category} 儲存完成: {file_path}")
              print(f"      筆數: {records_count} 筆 | 大小: {file_size_kb:.2f} KB")

          # -------------------------------------------------------------
          # 3. 執行任務 (車位高頻採樣；站位一天僅抓一次)
          # -------------------------------------------------------------
          print("[2/3] 處理動態即時車位 (Availability)...")
          fetch_and_write("availability", "https://tdx.transportdata.tw/api/basic/v2/Bike/Availability/City/Taipei?%24format=JSON", "availability")

          print("[3/3] 處理靜態站位資料 (Station)...")
          station_today_dir = os.path.join("data", "raw", "station", date_str)
          existing_station_files = glob.glob(os.path.join(station_today_dir, "*.json"))

          if existing_station_files and not force_station:
              print(f"  [跳過] 今日 ({date_str}) 已備份過靜態站位: {existing_station_files[0]}")
              print("         靜態站位一天僅抓取一次，跳過本次請求以節省頻寬與配額。")
          else:
              fetch_and_write("station", "https://tdx.transportdata.tw/api/basic/v2/Bike/Station/City/Taipei?%24format=JSON", "station")

          print(f"\n🎉 [{time_str}] 本次落盤任務執行完畢！")