name: Archive TDX Raw Data to Disk

on:
  schedule:
    # 每個小時的第 30 分鐘執行一次（避開整點尖峰負載）
    - cron: '30 * * * *'
  workflow_dispatch:
    inputs:
      force_refresh_token:
        description: '強制重新取得 Token (True/False)'
        required: false
        default: 'false'
        type: boolean
      force_station:
        description: '強制重新抓取今日靜態站位 (True/False)'
        required: false
        default: 'false'
        type: boolean

jobs:
  archive-to-disk:
    runs-on: self-hosted
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Fetch TDX and Save Raw JSON
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
        shell: python
        run: |
          import os
          import sys
          import json
          import time
          import datetime
          import urllib.request
          import urllib.parse
          import glob
          import ssl
          import gzip

          # 強制標準輸出為 UTF-8
          if hasattr(sys.stdout, 'reconfigure'):
              sys.stdout.reconfigure(encoding='utf-8')

          # -------------------------------------------------------------
          # 0. 環境與時間初始化 (台北時間 UTC+8)
          # -------------------------------------------------------------
          BASE_DIR = r"C:\Users\lutomica\Desktop\Dana mission\data"
          os.makedirs(BASE_DIR, exist_ok=True)
          token_cache_path = os.path.join(BASE_DIR, "token_cache.json")

          # 略過內網 Proxy/SSL 檢驗
          ssl_ctx = ssl._create_unverified_context()

          client_id = "ltmc.liao-89a1f100-a9ac-47ab"
          client_secret = "13a86ee7-314e-47a8-ac77-ffeb2f5660bd"
          
          force_refresh_token = "${{ github.event.inputs.force_refresh_token }}" == "true"
          force_station = "${{ github.event.inputs.force_station }}" == "true"

          now_utc8 = datetime.datetime.now(datetime.timezone.utc).astimezone(datetime.timezone(datetime.timedelta(hours=8)))
          date_str = now_utc8.strftime("%Y-%m-%d")
          time_str = now_utc8.strftime("%Y%m%d_%H%M")
          current_hour = now_utc8.hour  # 台北時間小時 (0~23)

          # -------------------------------------------------------------
          # 1. Token 機制：每天下午 15:00 強制換發，其他時間沿用快取
          # -------------------------------------------------------------
          token = None
          now_ts = time.time()
          is_3pm_window = (current_hour == 15)

          # 檢查是否有今日 15 點換過的有效快取
          if os.path.exists(token_cache_path) and not force_refresh_token:
              try:
                  with open(token_cache_path, "r", encoding="utf-8") as f:
                      cache = json.load(f)
                      token_date = cache.get("updated_date")
                      # 若不是下午 3 點窗口，或者今天 15 點已經成功換發過，直接沿用
                      if not (is_3pm_window and token_date != date_str) and cache.get("expires_at", 0) > now_ts + 600:
                          token = cache.get("access_token")
                          remaining_hours = (cache["expires_at"] - now_ts) / 3600
                          print(f"[1/3] 沿用本地 Token (剩餘有效: {remaining_hours:.1f} 小時)")
              except Exception as e:
                  print(f"快取讀取異常，重新申請: {e}")

          if not token:
              reason = "下午 3 點例行更換" if is_3pm_window else "本地無有效快取/強制更換"
              print(f"[1/3] 觸發 Token 換發 ({reason})...")
              token_url = "https://tdx.transportdata.tw/auth/realms/TDXConnect/protocol/openid-connect/token"
              payload = urllib.parse.urlencode({
                  "grant_type": "client_credentials",
                  "client_id": client_id,
                  "client_secret": client_secret
              }).encode("utf-8")
              
              req = urllib.request.Request(
                  token_url,
                  data=payload,
                  headers={"Content-Type": "application/x-www-form-urlencoded"}
              )
              with urllib.request.urlopen(req, timeout=15, context=ssl_ctx) as resp:
                  token_data = json.loads(resp.read().decode("utf-8"))
                  token = token_data["access_token"]
                  expires_in = token_data.get("expires_in", 86400)
                  
                  with open(token_cache_path, "w", encoding="utf-8") as f:
                      json.dump({
                          "access_token": token,
                          "expires_at": now_ts + expires_in,
                          "updated_date": date_str,
                          "updated_at": now_utc8.isoformat()
                      }, f, indent=2)
                  print(f"  -> 全新 Token 儲存成功: {token_cache_path}")

          # -------------------------------------------------------------
          # 2. 資料擷取與寫入工具
          # -------------------------------------------------------------
          def fetch_and_write(category, api_url, filename_prefix):
              print(f"[*] 正在抓取 TDX {category} (Gzip 壓縮)...")
              api_req = urllib.request.Request(
                  api_url,
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/json",
                      "Accept-Encoding": "gzip"
                  }
              )
              with urllib.request.urlopen(api_req, timeout=20, context=ssl_ctx) as r:
                  compressed_data = r.read()
                  content_encoding = r.headers.get("Content-Encoding", "").lower()
                  if "gzip" in content_encoding:
                      raw_data = gzip.decompress(compressed_data)
                  else:
                      raw_data = compressed_data

              target_dir = os.path.join(BASE_DIR, "raw", category, date_str)
              os.makedirs(target_dir, exist_ok=True)
              file_path = os.path.join(target_dir, f"{filename_prefix}_{time_str}.json")

              with open(file_path, "wb") as f:
                  f.write(raw_data)

              records_count = len(json.loads(raw_data.decode("utf-8")))
              file_size_kb = os.path.getsize(file_path) / 1024
              print(f"  [OK] {category} 落盤成功: {file_path}")
              print(f"       筆數: {records_count} 筆 | 檔案大小: {file_size_kb:.2f} KB")

          # -------------------------------------------------------------
          # 3. 每小時執行：即時動態車位
          # -------------------------------------------------------------
          print("[2/3] 處理動態即時車位 (Availability)...")
          fetch_and_write("availability", "https://tdx.transportdata.tw/api/basic/v2/Bike/Availability/City/Taipei?%24format=JSON", "availability")

          # -------------------------------------------------------------
          # 4. 每日執行一次：靜態站位資料
          # -------------------------------------------------------------
          print("[3/3] 處理靜態站位資料 (Station)...")
          station_today_dir = os.path.join(BASE_DIR, "raw", "station", date_str)
          existing_station_files = glob.glob(os.path.join(station_today_dir, "*.json"))

          if existing_station_files and not force_station:
              print(f"  [SKIP] 今日 ({date_str}) 已備份過靜態站位: {existing_station_files[0]}")
              print("         靜態站位每日僅抓取一次，跳過本次請求。")
          else:
              fetch_and_write("station", "https://tdx.transportdata.tw/api/basic/v2/Bike/Station/City/Taipei?%24format=JSON", "station")

          print(f"\n[DONE] [{time_str}] 本次落盤任務執行完畢！")