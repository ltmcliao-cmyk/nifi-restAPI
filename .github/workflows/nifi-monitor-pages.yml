name: Fetch NiFi Context (Manual Trigger)

# 僅手動點選 Run workflow 觸發
on:
  workflow_dispatch:

# 最小權限原則
permissions:
  contents: read

jobs:
  fetch-nifi-status:
    # 🎯 精確指定你的自託管 Windows Runner (company-runner)
    runs-on: [self-hosted, Windows, X64]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Python Dependencies
        # Windows Runner 預設使用本機安裝好的 Python 環境
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests urllib3

      - name: Execute Fetch Script
        # 執行 Python 腳本：抓取資料、產出 JSON、自動寫入 Action 頁面 Summary
        run: |
          python fetch_all_nifi_context.py

      - name: Upload JSON Artifact
        # 上傳一份 Artifact 作為備份，可於 Action 頁面底部隨時下載
        uses: actions/upload-artifact@v4
        with:
          name: nifi-context-report
          path: nifi_context.json
          retention-days: 7
          if-no-files-found: error