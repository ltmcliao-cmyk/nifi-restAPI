name: Continuous Pipeline Deployment

on:
  push:
    branches:
      - main
      - dev

env:
  ACTIONS_RUNNER_FORCED_NODE_VERSION: "node24" 

jobs:
  # 任務 1：本機測試部署（當 Push 到 dev 分支時觸發）
  deploy-to-local:
    if: github.ref == 'refs/heads/dev'
    runs-on: [self-hosted, local]
    steps:
      - name: 檢出儲存庫代碼
        uses: actions/checkout@v4

      - name: 安裝相依套件
        run: pip3 install --no-cache-dir nipyapi pyyaml

      - name: 執行本機拓撲部署
        run: |
          echo "正在部署至 [本機] NiFi..."
          export NIFI_HOST="http://nifi:8080"
          python3 deploy.py

  # 任務 2：公司機主要部署（當 Push 到 main 分支時觸發）
  deploy-to-company:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, company]
    steps:
      - name: 檢出儲存庫代碼
        uses: actions/checkout@v4

      - name: 安裝相依套件
        run: pip3 install --no-cache-dir nipyapi pyyaml

      - name: 執行公司機拓撲部署
        run: |
          echo "正在部署至 [公司機] NiFi..."
          export NIFI_HOST="http://nifi:8080"
          python3 deploy.py