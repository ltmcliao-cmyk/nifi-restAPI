name: Continuous Pipeline Deployment

on:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:

env:
  ACTIONS_RUNNER_FORCED_NODE_VERSION: "node24"

jobs:
  # 任務 1：本機測試部署（Push 到 dev 分支觸發 -> 派給 Linux/Mac 本機 Runner）
  deploy-to-local:
    if: github.ref == 'refs/heads/dev'
    runs-on: [self-hosted, Linux] 
    steps:
      - name: 檢出儲存庫代碼
        uses: actions/checkout@v4

      - name: 安裝相依套件
        run: pip3 install --user --no-cache-dir "nipyapi~=0.18.0" "pyyaml>=5.4.1"

      - name: 執行本機拓撲部署
        env:
          NIFI_HOST: "http://nifi:8080"
          PYTHONIOENCODING: "utf-8"
        run: |
          echo "正在部署至 [本機] NiFi..."
          python3 deploy.py

  # 任務 2：公司機主要部署（Push 到 main 分支觸發 -> 派給 Windows 本機 Runner）
  deploy-to-company:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Windows]
    defaults:
      run:
        shell: powershell
    steps:
      - name: 檢出儲存庫代碼
        uses: actions/checkout@v4

      - name: 安裝相依套件 (Windows)
        run: python -m pip install --no-cache-dir --force-reinstall "nipyapi~=0.18.0" "pyyaml>=5.4.1"

      - name: 執行公司機拓撲部署
        env:
          NIFI_HOST: "http://localhost:8080"
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
        run: |
          $OutputEncoding = [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          Write-Output "正在部署至 [公司機] NiFi..."
          python deploy.py