name: Continuous Pipeline Deployment

on:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:

env:
  ACTIONS_RUNNER_FORCED_NODE_VERSION: "node24"

jobs:
  # 任務 1：本機測試部署（Push 到 dev 分支觸發 -> 派給 Linux/Mac 本機 Runner）
  deploy-to-local:
    if: github.ref == 'refs/heads/dev'
    runs-on: [self-hosted, Linux]  # <-- 指定給 Linux 本機 Runner (若是 Mac 改寫 macOS)
    steps:
      - name: 檢出儲存庫代碼
        uses: actions/checkout@v4

      - name: 安裝相依套件
        run: pip3 install --no-cache-dir nipyapi pyyaml

      - name: 執行本機拓撲部署
        run: |
          echo "正在部署至 [本機] NiFi..."
          export NIFI_HOST="http://nifi:8080"
          python3 deploy.py

  # 任務 2：公司機主要部署（Push 到 main 分支觸發 -> 派給 Windows 公司機 Runner）
  deploy-to-company:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Windows] # <-- 改用 Windows 標籤，公司機 Runner 立刻接單！
    steps:
      - name: 檢出儲存庫代碼
        uses: actions/checkout@v4

      - name: 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.8'

      - name: 安裝相依套件 (Windows)
        run: pip install --no-cache-dir nipyapi pyyaml

      - name: 執行公司機拓撲部署
        env:
          NIFI_HOST: "http://localhost:8080"
        run: |
          echo "正在部署至 [公司機] NiFi..."
          python deploy.py