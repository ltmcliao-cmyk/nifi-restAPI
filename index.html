<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NiFi 監控儀表板</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --warn: #f59e0b;
      --danger: #ef4444;
      --success: #10b981;
      --border: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 24px;
      line-height: 1.5;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
    }

    .status-badge {
      font-size: 0.9rem;
      padding: 6px 12px;
      border-radius: 9999px;
      background: #334155;
    }

    .status-online {
      background-color: rgba(16, 185, 129, 0.2);
      color: var(--success);
      border: 1px solid var(--success);
    }

    .status-offline {
      background-color: rgba(239, 68, 68, 0.2);
      color: var(--danger);
      border: 1px solid var(--danger);
    }

    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }

    .kpi-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
    }

    .kpi-title {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .kpi-value {
      font-size: 1.75rem;
      font-weight: 700;
    }

    .section-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 24px;
    }

    .section-card h2 {
      font-size: 1.2rem;
      margin-bottom: 16px;
      color: var(--accent);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 0.9rem;
    }

    th, td {
      padding: 12px;
      border-bottom: 1px solid var(--border);
    }

    th {
      color: var(--text-muted);
      font-weight: 600;
      background-color: rgba(0, 0, 0, 0.2);
    }

    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 0.8rem;
      font-weight: 600;
    }

    .badge-warn {
      background-color: rgba(245, 158, 11, 0.2);
      color: var(--warn);
    }

    .badge-danger {
      background-color: rgba(239, 68, 68, 0.2);
      color: var(--danger);
    }

    .empty-msg {
      color: var(--text-muted);
      text-align: center;
      padding: 24px 0;
      font-size: 0.95rem;
    }
  </style>
</head>
<body>

  <header>
    <h1>NiFi 監控儀表板</h1>
    <div id="connectionStatus" class="status-badge status-offline">連線檢查中...</div>
  </header>

  <!-- KPI 指標區塊 -->
  <section class="kpi-grid">
    <div class="kpi-card">
      <div class="kpi-title">總連線數 (Connections)</div>
      <div id="kpiConnections" class="kpi-value">-</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-title">目前堆積量 (Queued FlowFiles)</div>
      <div id="kpiQueuedCount" class="kpi-value">-</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-title">堵塞連線數 (Bottlenecks)</div>
      <div id="kpiBottlenecks" class="kpi-value">-</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-title">無效元件數 (Invalid Processors)</div>
      <div id="kpiInvalidProcessors" class="kpi-value">-</div>
    </div>
  </section>

  <!-- 瓶頸連線清單 -->
  <section class="section-card">
    <h2>佇列背壓 / 堵塞連線清單</h2>
    <div id="bottleneckContainer">
      <p class="empty-msg">載入中...</p>
    </div>
  </section>

  <!-- 異常元件清單 -->
  <section class="section-card">
    <h2>無效處理器 (Invalid Processors) 清單</h2>
    <div id="invalidContainer">
      <p class="empty-msg">載入中...</p>
    </div>
  </section>

  <script>
    // 請填入您的 API 端點或 GitHub Gist Raw 連結
    const GIST_URL = "data.json"; 

    function setConnectionStatus(isOnline, message) {
      const el = document.getElementById("connectionStatus");
      if (!el) return;
      el.className = `status-badge ${isOnline ? "status-online" : "status-offline"}`;
      el.textContent = message;
    }

    function renderDashboard(data) {
      if (!data) return;

      // 1. 渲染 KPI 區塊
      document.getElementById("kpiConnections").textContent = data.total_connections ?? "-";
      document.getElementById("kpiQueuedCount").textContent = data.total_queued_count ?? "-";
      document.getElementById("kpiBottlenecks").textContent = (data.bottlenecks || []).length;
      document.getElementById("kpiInvalidProcessors").textContent = (data.invalid_processors || []).length;

      // 2. 渲染 Bottlenecks 表格
      const bContainer = document.getElementById("bottleneckContainer");
      if (data.bottlenecks && data.bottlenecks.length > 0) {
        let html = `<table>
          <thead>
            <tr>
              <th>連線名稱 / ID</th>
              <th>來源元件</th>
              <th>目標元件</th>
              <th>積壓數量</th>
              <th>積壓體積</th>
              <th>背壓使用率 (數量/容量)</th>
            </tr>
          </thead>
          <tbody>`;

        data.bottlenecks.forEach(b => {
          html += `<tr>
            <td><strong>${b.connection_name || b.connection_id}</strong></td>
            <td>${b.source_name || "-"}</td>
            <td>${b.destination_name || "-"}</td>
            <td><span class="badge badge-warn">${b.queued_count}</span></td>
            <td>${b.queued_size || "-"}</td>
            <td>${b.percent_use_count}% / ${b.percent_use_bytes}%</td>
          </tr>`;
        });

        html += `</tbody></table>`;
        bContainer.innerHTML = html;
      } else {
        bContainer.innerHTML = `<p class="empty-msg">佇列正常，無背壓或堵塞連線</p>`;
      }

      // 3. 渲染 Invalid Processors 表格
      const pContainer = document.getElementById("invalidContainer");
      if (data.invalid_processors && data.invalid_processors.length > 0) {
        let html = `<table>
          <thead>
            <tr>
              <th>Processor 名稱</th>
              <th>類型</th>
              <th>狀態</th>
              <th>驗證錯誤內容</th>
            </tr>
          </thead>
          <tbody>`;

        data.invalid_processors.forEach(p => {
          const errors = Array.isArray(p.validation_errors) 
            ? p.validation_errors.join("<br>") 
            : (p.validation_errors || "-");

          html += `<tr>
            <td><strong>${p.name || p.id}</strong></td>
            <td>${p.type || "-"}</td>
            <td><span class="badge badge-danger">${p.state || "INVALID"}</span></td>
            <td>${errors}</td>
          </tr>`;
        });

        html += `</tbody></table>`;
        pContainer.innerHTML = html;
      } else {
        pContainer.innerHTML = `<p class="empty-msg">所有 Processor 皆正常運行，無驗證錯誤</p>`;
      }
    }

    async function refreshMonitor() {
      try {
        const res = await fetch(GIST_URL);
        if (!res.ok) {
          throw new Error(`HTTP 錯誤: ${res.status}`);
        }

        const text = await res.text();

        // 避免伺服器回傳 HTML 網頁（例如 404/錯誤頁）導致 JSON.parse 報 Unexpected token '<'
        if (text.trim().startsWith("<")) {
          throw new Error("伺服器回傳了 HTML 而非 JSON 格式");
        }

        const data = JSON.parse(text);

        if (!data) {
          setConnectionStatus(false, "資料庫目前無資料 (請確認 Python 程式是否正在運行)");
          return;
        }

        renderDashboard(data);
        const updateTime = data.timestamp 
          ? new Date(data.timestamp).toLocaleTimeString() 
          : new Date().toLocaleTimeString();

        setConnectionStatus(true, `最後同步: ${updateTime}`);
      } catch (err) {
        setConnectionStatus(false, "無法連線至資料庫");
        console.error("Fetch error:", err);
      }
    }

    // 每 3 秒自動更新一次
    setInterval(refreshMonitor, 3000);
    refreshMonitor();
  </script>
</body>
</html>
