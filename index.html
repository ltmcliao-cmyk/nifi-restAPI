<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NiFi 監控儀表板</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="p-4 bg-gray-50 text-gray-800">
  <div class="max-w-6xl mx-auto space-y-6">
    <!-- 控制列 -->
    <header class="flex flex-wrap items-center justify-between gap-4 p-4 bg-white rounded-lg shadow-sm border border-gray-200">
      <div>
        <h1 class="text-xl font-bold text-gray-900">NiFi 監控狀態</h1>
        <p id="status-time" class="text-xs text-gray-500 mt-1">最後更新：尚未更新</p>
      </div>

      <div class="flex items-center gap-3">
        <label for="cfg-interval" class="text-sm text-gray-600">更新頻率：</label>
        <select id="cfg-interval" class="border border-gray-300 rounded px-2 py-1 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-blue-500">
          <option value="3000">3 秒</option>
          <option value="5000" selected>5 秒</option>
          <option value="10000">10 秒</option>
          <option value="30000">30 秒</option>
        </select>
        
        <button id="btn-manual-sync" class="px-3 py-1 bg-blue-600 hover:bg-blue-700 text-white text-sm font-medium rounded transition-colors">
          手動同步
        </button>
      </div>
    </header>

    <!-- 狀態連線提示 -->
    <div id="status-indicator" class="hidden p-3 rounded-lg text-sm"></div>

    <!-- KPI 卡片 -->
    <section class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-4">
      <div class="bg-white p-4 rounded-lg shadow-sm border border-gray-200">
        <p class="text-xs text-gray-500">執行中處理器</p>
        <p id="kpi-running" class="text-2xl font-bold text-green-600 mt-1">-</p>
      </div>
      <div class="bg-white p-4 rounded-lg shadow-sm border border-gray-200">
        <p class="text-xs text-gray-500">停止中處理器</p>
        <p id="kpi-stopped" class="text-2xl font-bold text-gray-600 mt-1">-</p>
      </div>
      <div class="bg-white p-4 rounded-lg shadow-sm border border-gray-200">
        <p class="text-xs text-gray-500">無效處理器</p>
        <p id="kpi-invalid" class="text-2xl font-bold text-red-600 mt-1">-</p>
      </div>
      <div class="bg-white p-4 rounded-lg shadow-sm border border-gray-200">
        <p class="text-xs text-gray-500">佇列項目總計</p>
        <p id="kpi-queued" class="text-2xl font-bold text-blue-600 mt-1">-</p>
      </div>
    </section>

    <!-- 原始資料預覽 -->
    <section class="bg-white p-4 rounded-lg shadow-sm border border-gray-200">
      <div class="flex items-center justify-between mb-3">
        <h2 class="text-sm font-semibold text-gray-700">即時監控數據 (Raw JSON)</h2>
        <button id="btn-copy-json" class="text-xs px-2 py-1 border border-gray-300 rounded hover:bg-gray-100 text-gray-600 transition-colors">
          複製 JSON
        </button>
      </div>
      <pre id="json-viewer" class="bg-gray-900 text-gray-100 p-4 rounded text-xs overflow-x-auto max-h-96">載入中...</pre>
    </section>
  </div>

  <script>
    // 正確的 Gist Raw 網址（檔名空白轉碼為 %20）
    const GIST_URL = "https://gist.githubusercontent.com/ltmcliao-cmyk/954552f04fc9dc1a6eb5b2d6d59cf403/raw/nifi%20monitor.json";
 
    let timerId = null;
    let cachedData = null;

    // 更新畫面指標
    function renderDashboard(data) {
      cachedData = data;
      
      const timeEl = document.getElementById("status-time");
      if (timeEl) timeEl.textContent = `最後更新：${new Date().toLocaleTimeString()}`;

      // 嘗試解析與映射常見 NiFi 狀態欄位
      const runningCount = data?.runningCount ?? data?.aggregateSnapshot?.runningCount ?? "-";
      const stoppedCount = data?.stoppedCount ?? data?.aggregateSnapshot?.stoppedCount ?? "-";
      const invalidCount = data?.invalidCount ?? data?.aggregateSnapshot?.invalidCount ?? "-";
      const queuedCount = data?.queuedCount ?? data?.aggregateSnapshot?.flowFilesQueued ?? "-";

      document.getElementById("kpi-running").textContent = runningCount;
      document.getElementById("kpi-stopped").textContent = stoppedCount;
      document.getElementById("kpi-invalid").textContent = invalidCount;
      document.getElementById("kpi-queued").textContent = queuedCount;

      const viewer = document.getElementById("json-viewer");
      if (viewer) {
        viewer.textContent = JSON.stringify(data, null, 2);
      }

      // 隱藏錯誤提示
      const statusEl = document.getElementById("status-indicator");
      if (statusEl) {
        statusEl.className = "hidden";
      }
    }

    // 抓取遠端資料
    async function fetchLatestData() {
      const statusEl = document.getElementById("status-indicator");
      try {
        const response = await fetch(`${GIST_URL}?t=${Date.now()}`, {
          cache: "no-store"
        });

        if (!response.ok) {
          throw new Error(`HTTP ${response.status} (${response.statusText})`);
        }

        const data = await response.json();
        renderDashboard(data);
      } catch (err) {
        console.error("更新失敗:", err);
        if (statusEl) {
          statusEl.textContent = `連線異常：${err.message}`;
          statusEl.className = "block p-3 rounded-lg text-sm bg-red-50 text-red-700 border border-red-200";
        }
      }
    }

    // 重設輪詢計時器
    function resetPolling() {
      if (timerId) clearInterval(timerId);

      const intervalSelect = document.getElementById("cfg-interval");
      const interval = parseInt(intervalSelect ? intervalSelect.value : 5000, 10);

      fetchLatestData();
      timerId = setInterval(fetchLatestData, interval);
    }

    // 事件綁定
    const btnSync = document.getElementById("btn-manual-sync");
    if (btnSync) btnSync.addEventListener("click", fetchLatestData);

    const selectInterval = document.getElementById("cfg-interval");
    if (selectInterval) selectInterval.addEventListener("change", resetPolling);

    const btnCopy = document.getElementById("btn-copy-json");
    if (btnCopy) {
      btnCopy.addEventListener("click", async () => {
        if (!cachedData) return;
        try {
          await navigator.clipboard.writeText(JSON.stringify(cachedData, null, 2));
          btnCopy.textContent = "已複製！";
          setTimeout(() => { btnCopy.textContent = "複製 JSON"; }, 2000);
        } catch (e) {
          alert("複製失敗");
        }
      });
    }

    // 首次啟動
    resetPolling();
  </script>
</body>
</html>
