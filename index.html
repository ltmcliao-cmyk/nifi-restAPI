<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NiFi 監控儀表板</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --border-color: #334155;
      --online: #10b981;
      --offline: #ef4444;
      --warning: #f59e0b;
      --accent: #3b82f6;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 24px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border-color);
    }

    .header h1 {
      font-size: 1.5rem;
      font-weight: 600;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      padding: 6px 12px;
      border-radius: 9999px;
      font-size: 0.875rem;
      font-weight: 500;
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
    }

    .status-online {
      color: var(--online);
      border-color: rgba(16, 185, 129, 0.4);
    }

    .status-offline {
      color: var(--offline);
      border-color: rgba(239, 68, 68, 0.4);
    }

    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }

    .kpi-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 20px;
    }

    .kpi-title {
      font-size: 0.875rem;
      color: var(--text-sub);
      margin-bottom: 8px;
    }

    .kpi-value {
      font-size: 1.75rem;
      font-weight: 700;
      color: var(--text-main);
    }

    .section-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 24px;
    }

    .section-card h2 {
      font-size: 1.125rem;
      margin-bottom: 16px;
      color: var(--text-main);
    }

    .empty-msg {
      color: var(--text-sub);
      font-size: 0.875rem;
    }

    .item-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .list-item {
      padding: 12px;
      background-color: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.875rem;
    }

    .item-error {
      color: var(--offline);
      font-size: 0.75rem;
      margin-top: 4px;
    }
  </style>
</head>
<body>

  <!-- 頂部標題與連線狀態 -->
  <header class="header">
    <h1>NiFi 流程即時監控</h1>
    <span id="connectionStatus" class="status-badge status-offline">連線中...</span>
  </header>

  <!-- KPI 摘要數據 -->
  <section class="kpi-grid">
    <div class="kpi-card">
      <div class="kpi-title">總連線數 (Connections)</div>
      <div class="kpi-value" id="kpiConnections">-</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-title">佇列 FlowFiles (Queued)</div>
      <div class="kpi-value" id="kpiQueued">-</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-title">執行中處理器 (Running)</div>
      <div class="kpi-value" id="kpiRunning">-</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-title">已停止處理器 (Stopped)</div>
      <div class="kpi-value" id="kpiStopped">-</div>
    </div>
  </section>

  <!-- 異常元件清單 -->
  <section class="section-card">
    <h2>無效處理器 (Invalid Processors) 清單</h2>
    <div id="invalidContainer">
      <p class="empty-msg">載入中...</p>
    </div>
  </section>

  <script>
    // 指向 Firebase Realtime Database REST 端點
    const FIREBASE_URL = "https://nifi-d2de1-default-rtdb.firebaseio.com/nifi_monitor.json";

    function setConnectionStatus(isOnline, message) {
      const el = document.getElementById("connectionStatus");
      if (!el) return;
      // 修復字串模板缺失反引號問題
      el.className = `status-badge ${isOnline ? "status-online" : "status-offline"}`;
      el.textContent = message;
    }

    function renderDashboard(data) {
      if (!data) return;

      // 1. KPI 欄位映射與容錯計算
      const kpi = data.kpi || {};

      // 計算所有 Process Group 的連線總數
      let totalConnections = data.total_connections;
      if (totalConnections === undefined && Array.isArray(data.process_groups_summary)) {
        totalConnections = data.process_groups_summary.reduce((acc, pg) => acc + (pg.connection_count || 0), 0);
      }
      document.getElementById("kpiConnections").textContent = totalConnections ?? "-";

      // 佇列數量 (優先取 kpi.flowFilesQueued)
      const queuedCount = kpi.flowFilesQueued ?? data.queued_count ?? 0;
      document.getElementById("kpiQueued").textContent = Number(queuedCount).toLocaleString();

      // 運行狀態計算
      document.getElementById("kpiRunning").textContent = kpi.runningCount ?? data.running_count ?? "-";
      document.getElementById("kpiStopped").textContent = kpi.stoppedCount ?? data.stopped_count ?? "-";

      // 2. 渲染無效處理器清單
      const invalidContainer = document.getElementById("invalidContainer");
      const invalidList = data.invalid_processors || [];

      if (!Array.isArray(invalidList) || invalidList.length === 0) {
        invalidContainer.innerHTML = '<p class="empty-msg">目前無任何異常或無效處理器。</p>';
      } else {
        invalidContainer.innerHTML = `
          <div class="item-list">
            ${invalidList.map(proc => `
              <div class="list-item">
                <div>
                  <strong>${proc.name || proc.id || "未命名元件"}</strong>
                  <div class="item-error">${proc.validation_errors?.join("； ") || "配置無效"}</div>
                </div>
                <span style="color: var(--offline); font-size: 0.75rem;">無效</span>
              </div>
            `).join("")}
          </div>
        `;
      }
    }

    async function refreshMonitor() {
      try {
        const response = await fetch(FIREBASE_URL);
        if (!response.ok) {
          throw new Error(`HTTP error! status: ${response.status}`);
        }
        const data = await response.json();
        renderDashboard(data);

        const updateTime = data?.timestamp
          ? new Date(data.timestamp).toLocaleTimeString()
          : new Date().toLocaleTimeString();

        setConnectionStatus(true, "最後同步: " + updateTime);
      } catch (err) {
        setConnectionStatus(false, "無法連線至資料庫");
        console.error("Fetch error:", err);
      }
    }

    // 每 3 秒輪詢更新一次
    setInterval(refreshMonitor, 3000);
    refreshMonitor();
  </script>
</body>
</html>
