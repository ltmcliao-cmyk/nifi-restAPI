<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NiFi 即時流程監控中心</title>
  <style>
    :root {
      --bg-dark: #0f172a;
      --card-bg: #1e293b;
      --card-border: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent-flow: #38bdf8;
      --accent-success: #10b981;
      --accent-warn: #f59e0b;
      --accent-err: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      padding: 24px;
      line-height: 1.5;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
    }

    /* 頂部導覽與狀態列 */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--card-border);
      margin-bottom: 24px;
      flex-wrap: wrap;
      gap: 12px;
    }

    .brand-title {
      font-size: 1.4rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 0.85rem;
    }

    .connection-status {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 12px;
      border-radius: 999px;
      background: #334155;
      color: var(--text-muted);
      font-weight: 500;
      transition: all 0.3s ease;
    }

    .connection-status.connected {
      background: rgba(16, 185, 129, 0.15);
      color: var(--accent-success);
    }

    .connection-status.disconnected {
      background: rgba(239, 68, 68, 0.15);
      color: var(--accent-err);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: currentColor;
    }

    .update-time {
      color: var(--text-muted);
    }

    /* 區塊標題 */
    .section-title {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
      color: #e2e8f0;
    }

    /* Process Group 卡片網格 */
    .pg-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
      gap: 20px;
      margin-bottom: 36px;
    }

    .pg-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 18px;
      position: relative;
      transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .pg-card:hover {
      transform: translateY(-2px);
    }

    .pg-card.is-active {
      border-color: rgba(56, 189, 248, 0.7);
      box-shadow: 0 0 20px rgba(56, 189, 248, 0.12);
    }

    .pg-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 12px;
      gap: 8px;
    }

    .pg-name {
      font-size: 1.05rem;
      font-weight: 600;
      color: #ffffff;
      word-break: break-all;
    }

    .pg-badge {
      font-size: 0.75rem;
      padding: 2px 8px;
      border-radius: 6px;
      font-weight: 600;
      white-space: nowrap;
      background: #334155;
      color: var(--text-muted);
    }

    .pg-badge.running {
      background: rgba(16, 185, 129, 0.2);
      color: #34d399;
    }

    /* FlowFile 動態流動軌道 */
    .stream-container {
      margin: 14px 0;
    }

    .stream-label-row {
      display: flex;
      justify-content: space-between;
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    .stream-track {
      height: 8px;
      background: #090d16;
      border-radius: 4px;
      overflow: hidden;
      position: relative;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .stream-flow {
      height: 100%;
      width: 100%;
      opacity: 0.15;
      background: repeating-linear-gradient(
        90deg,
        #475569 0px,
        #475569 10px,
        transparent 10px,
        transparent 20px
      );
    }

    /* 運行中的動態傳輸效果 */
    .stream-flow.active {
      opacity: 1;
      background: repeating-linear-gradient(
        90deg,
        var(--accent-flow) 0px,
        var(--accent-flow) 14px,
        rgba(56, 189, 248, 0.2) 14px,
        rgba(56, 189, 248, 0.2) 28px
      );
      background-size: 56px 100%;
      animation: flowMoving 0.9s linear infinite;
    }

    @keyframes flowMoving {
      0% { background-position: 0 0; }
      100% { background-position: 56px 0; }
    }

    /* PG 數據欄位 */
    .pg-stats-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-top: 14px;
    }

    .stat-box {
      background: #0f172a;
      padding: 10px 12px;
      border-radius: 6px;
      border: 1px solid rgba(255, 255, 255, 0.03);
    }

    .stat-title {
      font-size: 0.7rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 2px;
    }

    .stat-val {
      font-size: 1.05rem;
      font-weight: 700;
      color: #f1f5f9;
    }

    .stat-val.has-queue {
      color: var(--accent-warn);
    }

    .stat-val.has-active {
      color: var(--accent-flow);
    }

    /* 警報/異常 Bulletin 表格 */
    .bulletins-section {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 20px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.85rem;
      text-align: left;
    }

    th {
      color: var(--text-muted);
      font-weight: 600;
      padding: 10px 12px;
      border-bottom: 1px solid var(--card-border);
      font-size: 0.75rem;
      text-transform: uppercase;
    }

    td {
      padding: 12px;
      border-bottom: 1px solid rgba(51, 65, 85, 0.5);
      color: #cbd5e1;
      vertical-align: top;
      word-break: break-all;
    }

    tr:last-child td {
      border-bottom: none;
    }

    .badge-err {
      background: rgba(239, 68, 68, 0.2);
      color: #f87171;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: 600;
    }

    .badge-warn {
      background: rgba(245, 158, 11, 0.2);
      color: #fbbf24;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: 600;
    }

    .empty-placeholder {
      text-align: center;
      padding: 28px;
      color: var(--text-muted);
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="brand-title">
        <span>⚡ NiFi Process Groups 即時監控</span>
      </div>
      <div class="header-actions">
        <div id="connectionStatus" class="connection-status">
          <span class="status-dot"></span>
          <span id="connectionText">連線中...</span>
        </div>
        <div id="lastUpdated" class="update-time">-</div>
      </div>
    </header>

    <!-- PG 獨立監控區域 -->
    <div class="section-title">流程群組運行動態 (Process Groups)</div>
    <div id="pgContainer" class="pg-grid">
      <div class="empty-placeholder">載入流程群組資料中...</div>
    </div>

    <!-- 系統 Bulletin 警告/錯誤 -->
    <div class="bulletins-section">
      <div class="section-title" style="margin-bottom: 12px;">即時公告與異常訊息 (Bulletins)</div>
      <table>
        <thead>
          <tr>
            <th style="width: 90px;">等級</th>
            <th style="width: 220px;">來源元件</th>
            <th>訊息內容</th>
          </tr>
        </thead>
        <tbody id="bulletinsBody">
          <tr>
            <td colspan="3" class="empty-placeholder">暫無異常公告</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    // 填入 Firebase 即時資料庫 URL 或 API 節點
    const FIREBASE_URL = "https://your-firebase-database.firebasedatabase.app/nifi_status.json";
    const POLL_INTERVAL = 3000;

    const connectionStatusEl = document.getElementById("connectionStatus");
    const connectionTextEl = document.getElementById("connectionText");
    const lastUpdatedEl = document.getElementById("lastUpdated");
    const pgContainer = document.getElementById("pgContainer");
    const bulletinsBody = document.getElementById("bulletinsBody");

    function setConnectionStatus(isConnected, text) {
      if (isConnected) {
        connectionStatusEl.className = "connection-status connected";
        connectionTextEl.textContent = text || "連線正常";
      } else {
        connectionStatusEl.className = "connection-status disconnected";
        connectionTextEl.textContent = text || "連線中斷";
      }
    }

    // 解析各 PG 狀態（相容 NiFi 原生快照結構或自定義結構）
    function parseProcessGroups(data) {
      if (!data) return [];

      // 若後端已預先處理為清單
      if (Array.isArray(data.processGroups)) return data.processGroups;
      if (Array.isArray(data.pgs)) return data.pgs;

      // 若為 NiFi aggregateSnapshot 原始樹狀結構
      const rootSnap = data.processGroupStatus?.aggregateSnapshot ||
                       data.aggregateSnapshot ||
                       (data.status && data.status.aggregateSnapshot);

      if (rootSnap && Array.isArray(rootSnap.processGroupStatusSnapshots)) {
        return rootSnap.processGroupStatusSnapshots.map(item => {
          const snap = item.processGroupStatusSnapshot || item;
          return {
            id: snap.id,
            name: snap.name || "未命名流程群組",
            activeThreadCount: Number(snap.activeThreadCount || 0),
            queuedCount: Number(snap.flowFilesQueued || snap.queuedCount || 0),
            bytesQueued: snap.bytesQueued || "0 B",
            flowFilesIn: Number(snap.flowFilesIn || snap.bytesIn || 0),
            flowFilesOut: Number(snap.flowFilesOut || snap.bytesOut || 0)
          };
        });
      }

      return [];
    }

    function renderDashboard(data) {
      lastUpdatedEl.textContent = `最後同步：${new Date().toLocaleTimeString()}`;

      // 1. 渲染各 Process Group 卡片
      const pgs = parseProcessGroups(data);
      if (pgs.length === 0) {
        pgContainer.innerHTML = `<div class="empty-placeholder">未偵測到任何子 Process Group</div>`;
      } else {
        pgContainer.innerHTML = pgs.map(pg => {
          // 當執行緒 > 0 或 5 分鐘內有流量進出時視為流動中
          const isFlowing = (pg.activeThreadCount > 0) || (pg.flowFilesIn > 0) || (pg.flowFilesOut > 0);
          const hasQueued = (pg.queuedCount > 0);

          return `
            <div class="pg-card ${isFlowing ? 'is-active' : ''}">
              <div class="pg-header">
                <span class="pg-name">${pg.name}</span>
                <span class="pg-badge ${isFlowing ? 'running' : ''}">
                  ${isFlowing ? '⚡ 流動中' : '💤 閒置'}
                </span>
              </div>

              <!-- 動態虛線傳輸條 -->
              <div class="stream-container">
                <div class="stream-label-row">
                  <span>FlowFile Stream</span>
                  <span>${isFlowing ? '傳輸中' : '靜止'}</span>
                </div>
                <div class="stream-track">
                  <div class="stream-flow ${isFlowing ? 'active' : ''}"></div>
                </div>
              </div>

              <div class="pg-stats-grid">
                <div class="stat-box">
                  <div class="stat-title">佇列 (Queued)</div>
                  <div class="stat-val ${hasQueued ? 'has-queue' : ''}">
                    ${pg.queuedCount.toLocaleString()} <span style="font-size:0.75rem;font-weight:normal;color:#94a3b8;">筆</span>
                  </div>
                </div>

                <div class="stat-box">
                  <div class="stat-title">執行緒 (Threads)</div>
                  <div class="stat-val ${pg.activeThreadCount > 0 ? 'has-active' : ''}">
                    ${pg.activeThreadCount}
                  </div>
                </div>

                <div class="stat-box">
                  <div class="stat-title">流入 (In / 5m)</div>
                  <div class="stat-val">${pg.flowFilesIn.toLocaleString()}</div>
                </div>

                <div class="stat-box">
                  <div class="stat-title">流出 (Out / 5m)</div>
                  <div class="stat-val">${pg.flowFilesOut.toLocaleString()}</div>
                </div>
              </div>
            </div>
          `;
        }).join("");
      }

      // 2. 渲染 Bulletins
      const rawBulletins = data.bulletins ||
                           data.bulletinBoard?.bulletins ||
                           (data.bulletinBoard && data.bulletinBoard.bulletins) || [];

      if (!rawBulletins || rawBulletins.length === 0) {
        bulletinsBody.innerHTML = `<tr><td colspan="3" class="empty-placeholder">目前無異常警報</td></tr>`;
      } else {
        bulletinsBody.innerHTML = rawBulletins.slice(0, 10).map(b => {
          const item = b.bulletin || b;
          const isErr = item.level === "ERROR";
          return `
            <tr>
              <td><span class="${isErr ? 'badge-err' : 'badge-warn'}">${item.level || "INFO"}</span></td>
              <td>${item.sourceName || item.sourceId || "-"}</td>
              <td>${item.message || "-"}</td>
            </tr>
          `;
        }).join("");
      }
    }

    async function fetchData() {
      try {
        const res = await fetch(FIREBASE_URL);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        setConnectionStatus(true, "連線正常");
        renderDashboard(data);
      } catch (err) {
        setConnectionStatus(false, "連線失敗");
        console.error("Fetch error:", err);
      }
    }

    // 啟動定時輪詢
    fetchData();
    setInterval(fetchData, POLL_INTERVAL);
  </script>
</body>
</html>
