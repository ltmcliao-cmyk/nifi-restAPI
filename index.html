<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Apache NiFi 實時監控儀表板</title>
  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: #111827;
      --border: #1e293b;
      --text: #e2e8f0;
      --text-muted: #64748b;
      --accent: #38bdf8;
      --success: #22c55e;
      --danger: #ef4444;
      --warning: #f59e0b;
    }

    * { box-sizing: border-box; }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 24px;
      line-height: 1.5;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      flex-wrap: wrap;
      gap: 12px;
    }

    .status-badge {
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .status-online { background-color: rgba(34, 197, 94, 0.2); color: var(--success); }
    .status-offline { background-color: rgba(239, 68, 68, 0.2); color: var(--danger); }

    .actions-bar {
      display: flex;
      gap: 10px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }

    .btn {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 500;
      font-size: 13px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .btn:hover {
      background-color: var(--border);
      border-color: var(--accent);
    }

    .btn-ai {
      background-color: #0284c7;
      border-color: #38bdf8;
      color: #fff;
      font-weight: 600;
    }

    .btn-ai:hover {
      background-color: #0369a1;
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.35);
    }

    /* KPI 卡片 */
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
      gap: 14px;
      margin-bottom: 24px;
    }

    .kpi-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px 18px;
    }

    .kpi-label {
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    .kpi-value {
      font-size: 22px;
      font-weight: 700;
      color: #f1f5f9;
    }

    .kpi-value.danger { color: var(--danger); }
    .kpi-value.warning { color: var(--warning); }
    .kpi-value.accent { color: var(--accent); }

    /* 快速除錯警報面板 */
    .debug-alert-panel {
      background: rgba(239, 68, 68, 0.08);
      border: 1px solid rgba(239, 68, 68, 0.3);
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 24px;
      display: none;
    }

    .debug-alert-panel.active { display: block; }

    .debug-header {
      color: var(--danger);
      font-weight: 700;
      margin-bottom: 12px;
      font-size: 14px;
    }

    .debug-item {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 10px 14px;
      margin-bottom: 8px;
      font-size: 13px;
    }

    .section-title {
      font-size: 16px;
      font-weight: 600;
      margin: 28px 0 14px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Process Group 卡片 */
    .pg-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
      gap: 18px;
      margin-bottom: 28px;
    }

    .pg-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 18px;
      position: relative;
      transition: border-color 0.2s, transform 0.2s;
    }

    .pg-card:hover { transform: translateY(-2px); }
    .pg-card.is-active { border-color: var(--accent); }
    .pg-card.has-error { border-color: var(--danger); }

    .pg-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 10px;
      gap: 10px;
    }

    .pg-name {
      font-weight: 700;
      font-size: 14px;
      color: #fff;
      word-break: break-all;
    }

    .pg-sub-id {
      font-size: 11px;
      color: var(--text-muted);
      font-family: monospace;
    }

    .pg-state-pill {
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 999px;
      background: #334155;
      color: var(--text-muted);
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      white-space: nowrap;
    }

    .pg-state-pill.active {
      background: rgba(34, 197, 94, 0.18);
      color: var(--success);
    }

    .pg-state-pill.error {
      background: rgba(239, 68, 68, 0.18);
      color: var(--danger);
    }

    .state-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: currentColor;
    }

    .pg-state-pill.active .state-dot {
      animation: pulseDot 1.5s infinite;
    }

    /* 水流軌道動態 */
    .stream-wrapper { margin: 12px 0 14px; }
    .stream-meta {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    .stream-track {
      height: 7px;
      background: #090d16;
      border-radius: 4px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .stream-flow {
      height: 100%;
      width: 100%;
      opacity: 0.15;
      background: repeating-linear-gradient(90deg, #475569 0px, #475569 10px, transparent 10px, transparent 20px);
    }

    .stream-flow.flowing {
      opacity: 1;
      background: repeating-linear-gradient(90deg, var(--accent) 0px, var(--accent) 14px, rgba(56, 189, 248, 0.2) 14px, rgba(56, 189, 248, 0.2) 28px);
      background-size: 56px 100%;
      animation: streamFlowing 0.85s linear infinite;
    }

    @keyframes streamFlowing {
      0% { background-position: 0 0; }
      100% { background-position: 56px 0; }
    }

    @keyframes pulseDot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.35; transform: scale(0.8); }
    }

    .pg-metrics-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }

    .metric-cell {
      background: #0f172a;
      padding: 8px 10px;
      border-radius: 6px;
      border: 1px solid rgba(255, 255, 255, 0.03);
    }

    .metric-name { font-size: 11px; color: var(--text-muted); margin-bottom: 2px; }
    .metric-data { font-size: 14px; font-weight: 700; color: #f1f5f9; }
    .metric-data.warn { color: var(--warning); }
    .metric-data.danger { color: var(--danger); }
    .metric-data.highlight { color: var(--accent); }

    .pg-actions {
      display: flex;
      gap: 8px;
      margin-top: 14px;
    }

    .pg-details {
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px dashed var(--border);
      display: none;
      font-size: 12px;
    }

    .pg-details.open { display: block; }

    .processor-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      gap: 8px;
    }

    .status-tag {
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: 600;
      white-space: nowrap;
    }
    .tag-valid { background: rgba(34, 197, 94, 0.2); color: var(--success); }
    .tag-invalid { background: rgba(239, 68, 68, 0.2); color: var(--danger); }

    /* 表格共用樣式 */
    table {
      width: 100%;
      border-collapse: collapse;
      background-color: var(--card-bg);
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid var(--border);
      margin-bottom: 20px;
    }

    th, td {
      padding: 10px 14px;
      text-align: left;
      font-size: 13px;
      border-bottom: 1px solid var(--border);
    }

    th { background-color: #162032; color: var(--text-muted); font-weight: 600; }
    .empty-state { padding: 18px; text-align: center; color: var(--text-muted); font-size: 13px; }
    .badge-warn { color: var(--warning); font-weight: 600; }
    .badge-err { color: var(--danger); font-weight: bold; }

    #toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: #0284c7;
      color: #fff;
      padding: 12px 20px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.4);
      display: none;
      z-index: 1000;
    }
  </style>
</head>
<body>

  <div class="header">
    <h2>Apache NiFi 監控儀表板</h2>
    <div id="connectionStatus" class="status-badge status-online">
      <span class="state-dot"></span> 連線正常 (Firebase Streaming)
    </div>
  </div>

  <div class="actions-bar">
    <button class="btn btn-ai" onclick="triggerManualRefresh()">🔄 立即刷新快照 (模擬 Delta 異動)</button>
  </div>

  <!-- KPI 區塊 -->
  <div class="kpi-grid">
    <div class="kpi-card">
      <div class="kpi-label">活躍執行緒 (Active Threads)</div>
      <div class="kpi-value" id="kpiActiveThreads">0</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-label">累積寫入 (Bytes Written)</div>
      <div class="kpi-value highlight" id="kpiBytesWritten">0 B</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-label">佇列 FlowFiles (Queued)</div>
      <div class="kpi-value" id="kpiQueuedFlowFiles">0</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-label">異常元件 (Invalid Components)</div>
      <div class="kpi-value danger" id="kpiInvalidComponents">0</div>
    </div>
  </div>

  <!-- 快速除錯警報面板 -->
  <div class="debug-alert-panel" id="debugAlertPanel">
    <div class="debug-header">⚠️ 系統異常警報面板 (Debug Alert Panel)</div>
    <div id="debugAlertList"></div>
  </div>

  <div class="section-title">📦 Process Groups 狀態監控 (時間序列增量狀態機)</div>
  <div class="pg-grid" id="pgGridContainer"></div>

  <div id="toast">快照資料更新成功</div>

  <script>
    // 時間序列歷史微快照記憶體 (全域單例)
    let lastSnapshot = null;
    let countdownTimerId = null;

    /**
     * 主渲染函式：解析 Firebase JSON 並驅動狀態機與視覺化 UI
     * @param {Object} currentSnapshot Firebase 傳輸之 JSON 快照數據
     */
    function renderDashboard(currentSnapshot) {
      if (!currentSnapshot) return;

      // 清除前一次的倒數計時器
      if (countdownTimerId) clearInterval(countdownTimerId);

      // 1. 綁定行政元資料與全域 KPI
      const kpi = currentSnapshot.kpi || {};
      const controller = currentSnapshot.controller_status || {};
      const invalidCount = kpi.invalidComponentCount ?? controller.invalidCount ?? 0;

      document.getElementById('kpiActiveThreads').innerText = kpi.activeThreadCount ?? controller.activeThreadCount ?? 0;
      document.getElementById('kpiBytesWritten').innerText = formatBytes(kpi.bytesWritten || 0);
      document.getElementById('kpiQueuedFlowFiles').innerText = kpi.flowFilesQueued ?? controller.flowFilesQueued ?? 0;
      document.getElementById('kpiInvalidComponents').innerText = invalidCount;

      // 2. 評估與渲染警報面板 (#debugAlertPanel)
      renderDebugAlertPanel(currentSnapshot, invalidCount);

      // 3. 過濾行政元資料 (如 target_process_group_id = "root" 且無 Processor 之根卡片)
      const targetPgId = currentSnapshot.target_process_group_id || "root";
      const pgSummaries = (currentSnapshot.process_groups_summary || []).filter(pg => {
        // 若該 PG 為 root 且未包含 Processor 則過濾，確保 UI 清潔
        return !(pg.process_group_id === targetPgId && pg.processor_count === 0);
      });

      const blueprints = currentSnapshot.processors_blueprint || [];
      const pgGridContainer = document.getElementById('pgGridContainer');
      pgGridContainer.innerHTML = '';

      // 4. 逐一構建 Process Group 時間序列狀態
      pgSummaries.forEach(pg => {
        const pgProcessors = blueprints.filter(p => p.process_group_id === pg.process_group_id);
        const aggregatedCurrent = aggregatePgMetrics(pgProcessors);

        // 跨快照 Delta 運算 (N vs N-1)
        let deltaBytes = 0;
        let deltaFlowFiles = 0;

        if (lastSnapshot) {
          const lastBlueprints = lastSnapshot.processors_blueprint || [];
          const lastPgProcessors = lastBlueprints.filter(p => p.process_group_id === pg.process_group_id);
          const aggregatedLast = aggregatePgMetrics(lastPgProcessors);

          deltaBytes = Math.max(0, aggregatedCurrent.bytesWritten - aggregatedLast.bytesWritten);
          deltaFlowFiles = Math.max(0, aggregatedCurrent.flowFilesOut - aggregatedLast.flowFilesOut);
        } else {
          // 首採樣快照：若有累積流量，即判定為活躍傳輸中
          deltaBytes = aggregatedCurrent.bytesWritten;
          deltaFlowFiles = aggregatedCurrent.flowFilesOut;
        }

        // 檢查該 PG 轄下是否有元件錯誤
        const hasProcessorErrors = pgProcessors.some(p => (p.validationErrors && p.validationErrors.length > 0) || p.runStatus === "INVALID");

        // 狀態機決策邏輯 (Finite State Machine Decision)
        const isFlowing = deltaBytes > 0 || deltaFlowFiles > 0;
        let pillClass = "pg-state-pill";
        let cardClass = "pg-card";
        let initialStatusText = "";

        if (hasProcessorErrors) {
          pillClass = "pg-state-pill error";
          cardClass = "pg-card has-error";
          initialStatusText = "⚠️ 元件設定異常";
        } else if (isFlowing) {
          pillClass = "pg-state-pill active";
          cardClass = "pg-card is-active";
          initialStatusText = "🌊 活躍傳輸中";
        } else if (pg.processor_count > 0) {
          pillClass = "pg-state-pill";
          initialStatusText = getScheduledCountdownText(currentSnapshot.timestamp, 10);
        } else {
          pillClass = "pg-state-pill";
          initialStatusText = "靜止 (Idle)";
        }

        // 5. 構建 PG DOM 卡片 (含內部 Processor 子組件細節)
        const cardElem = document.createElement('div');
        cardElem.className = cardClass;
        
        const pillId = `pill-status-${pg.process_group_id}`;
        
        // 渲染子組件 Processor 列表 HTML
        const processorsDetailHtml = pgProcessors.map(proc => {
          const isValid = !proc.validationErrors || proc.validationErrors.length === 0;
          const statusTag = isValid 
            ? `<span class="status-tag tag-valid">${proc.runStatus || 'VALID'}</span>`
            : `<span class="status-tag tag-invalid">INVALID</span>`;
          
          return `
            <div class="processor-row">
              <div>
                <strong>${escapeHtml(proc.name || proc.id)}</strong>
                <div style="font-size: 10px; color: var(--text-muted);">${escapeHtml(proc.type || '')}</div>
              </div>
              <div style="text-align: right;">
                ${statusTag}
                <div style="font-size: 11px; margin-top:2px;">Out: ${proc.flowFilesOut || 0} | Write: ${formatBytes(proc.bytesWritten || 0)}</div>
              </div>
            </div>
          `;
        }).join('');

        cardElem.innerHTML = `
          <div class="pg-header">
            <div>
              <div class="pg-name">${escapeHtml(pg.process_group_id)}</div>
              <div class="pg-sub-id">Processors: ${pg.processor_count} | Connections: ${pg.connection_count}</div>
            </div>
            <div class="${pillClass}" id="${pillId}">
              <span class="state-dot"></span> ${initialStatusText}
            </div>
          </div>

          <div class="stream-wrapper">
            <div class="stream-meta">
              <span>即時資料流動狀態</span>
              <span>${isFlowing ? '傳輸中 (Streaming)' : '待命 (Standby)'}</span>
            </div>
            <div class="stream-track">
              <div class="stream-flow ${isFlowing ? 'flowing' : ''}"></div>
            </div>
          </div>

          <div class="pg-metrics-grid">
            <div class="metric-cell">
              <div class="metric-name">累積 FlowFiles 產出</div>
              <div class="metric-data ${deltaFlowFiles > 0 ? 'highlight' : ''}">${aggregatedCurrent.flowFilesOut}</div>
            </div>
            <div class="metric-cell">
              <div class="metric-name">累積寫入吞吐 (Bytes)</div>
              <div class="metric-data ${deltaBytes > 0 ? 'highlight' : ''}">${formatBytes(aggregatedCurrent.bytesWritten)}</div>
            </div>
          </div>

          <div class="pg-actions">
            <button class="btn" onclick="togglePgDetails(this)">🔍 檢視 Processor 細節 (${pgProcessors.length})</button>
          </div>

          <div class="pg-details">
            <div style="font-weight:600; margin-bottom:8px; color: var(--accent);">轄下 Processor 元件清單：</div>
            ${processorsDetailHtml || '<div class="empty-state">無 Processor 明細數據</div>'}
          </div>
        `;

        pgGridContainer.appendChild(cardElem);
      });

      // 6. 啟動即時排程倒數 Ticker，補足採樣間隔的時間感
      countdownTimerId = setInterval(() => {
        pgSummaries.forEach(pg => {
          const pgProcessors = blueprints.filter(p => p.process_group_id === pg.process_group_id);
          const hasProcessorErrors = pgProcessors.some(p => (p.validationErrors && p.validationErrors.length > 0) || p.runStatus === "INVALID");
          
          let deltaBytes = 0;
          let deltaFlowFiles = 0;
          if (lastSnapshot) {
            const lastPgProcessors = (lastSnapshot.processors_blueprint || []).filter(p => p.process_group_id === pg.process_group_id);
            const aggregatedCurrent = aggregatePgMetrics(pgProcessors);
            const aggregatedLast = aggregatePgMetrics(lastPgProcessors);
            deltaBytes = Math.max(0, aggregatedCurrent.bytesWritten - aggregatedLast.bytesWritten);
            deltaFlowFiles = Math.max(0, aggregatedCurrent.flowFilesOut - aggregatedLast.flowFilesOut);
          }

          if (!hasProcessorErrors && deltaBytes === 0 && deltaFlowFiles === 0 && pg.processor_count > 0) {
            const pillElem = document.getElementById(`pill-status-${pg.process_group_id}`);
            if (pillElem) {
              pillElem.innerHTML = `<span class="state-dot"></span> ${getScheduledCountdownText(currentSnapshot.timestamp, 10)}`;
            }
          }
        });
      }, 1000);

      // 儲存當前快照至時間序列歷史記憶體
      lastSnapshot = currentSnapshot;
    }

    /**
     * 計算排程倒數字串 (根據 ISO Timestamp 與週期秒數)
     */
    function getScheduledCountdownText(isoTimestampStr, periodSeconds = 10) {
      if (!isoTimestampStr) return `⏱️ 排程待命中（週期 ${periodSeconds}s）`;
      const snapshotMs = Date.parse(isoTimestampStr);
      const nowMs = Date.now();
      const elapsedSec = Math.floor(Math.max(0, (nowMs - snapshotMs) / 1000));
      const remainingSec = Math.max(0, periodSeconds - (elapsedSec % periodSeconds));
      return `⏱️ 排程待命中（倒數 ${remainingSec}s / 週期 ${periodSeconds}s）`;
    }

    /**
     * 處理並渲染快速除錯警報面板 (#debugAlertPanel)
     */
    function renderDebugAlertPanel(snapshot, invalidCount) {
      const alertPanel = document.getElementById('debugAlertPanel');
      const alertList = document.getElementById('debugAlertList');
      alertList.innerHTML = '';

      const alertItems = [];

      if (invalidCount > 0) {
        alertItems.push(`系統檢測到 ${invalidCount} 個無效/配置異常元件，請檢查 Controller Services 設定。`);
      }

      const blueprints = snapshot.processors_blueprint || [];
      blueprints.forEach(p => {
        if (p.validationErrors && p.validationErrors.length > 0) {
          p.validationErrors.forEach(err => {
            alertItems.push(`Processor <strong>[${escapeHtml(p.name || p.id)}]</strong> 驗證失敗: ${escapeHtml(err)}`);
          });
        }
      });

      if (alertItems.length > 0) {
        alertPanel.classList.add('active');
        alertItems.forEach(msg => {
          const itemDiv = document.createElement('div');
          itemDiv.className = 'debug-item';
          itemDiv.innerHTML = msg;
          alertList.appendChild(itemDiv);
        });
      } else {
        alertPanel.classList.remove('active');
      }
    }

    /**
     * 手風琴 Toggle 函式：展開/折疊 Processor 子組件細節
     */
    function togglePgDetails(btn) {
      const card = btn.closest('.pg-card');
      const details = card.querySelector('.pg-details');
      if (details) {
        details.classList.toggle('open');
        btn.innerText = details.classList.contains('open') 
          ? '🔼 隱藏 Processor 細節' 
          : `🔍 檢視 Processor 細節 (${card.querySelectorAll('.processor-row').length})`;
      }
    }

    /**
     * 聚合特定 PG 的 Processor 指標
     */
    function aggregatePgMetrics(processors) {
      return processors.reduce((acc, proc) => {
        acc.flowFilesIn += proc.flowFilesIn || 0;
        acc.flowFilesOut += proc.flowFilesOut || 0;
        acc.bytesWritten += proc.bytesWritten || 0;
        return acc;
      }, { flowFilesIn: 0, flowFilesOut: 0, bytesWritten: 0 });
    }

    /**
     * 位元組格式化工具
     */
    function formatBytes(bytes) {
      if (bytes === 0) return '0 B';
      const k = 1024;
      const sizes = ['B', 'KB', 'MB', 'GB'];
      const i = Math.floor(Math.log(bytes) / Math.log(k));
      return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
    }

    function escapeHtml(str) {
      return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.innerText = msg;
      toast.style.display = 'block';
      setTimeout(() => { toast.style.display = 'none'; }, 3000);
    }

    /**
