<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <title>NiFi 流程即時監控</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --danger: #ef4444;
      --warning: #f59e0b;
      --success: #22c55e;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 24px;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }
    .status-badge {
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
    }
    .status-online { background-color: rgba(34, 197, 94, 0.2); color: var(--success); }
    .status-offline { background-color: rgba(239, 68, 68, 0.2); color: var(--danger); }
    
    .actions-bar {
      display: flex;
      gap: 12px;
      margin-bottom: 20px;
    }
    .btn {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 500;
      transition: all 0.2s;
    }
    .btn:hover { background-color: var(--border); border-color: var(--accent); }
    .btn-primary { background-color: #0284c7; border-color: #0284c7; }
    .btn-primary:hover { background-color: #0369a1; }

    .grid-kpi {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }
    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
    }
    .card-title {
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 8px;
    }
    .card-value {
      font-size: 26px;
      font-weight: 700;
      color: var(--text);
    }

    .section-title {
      font-size: 16px;
      font-weight: 600;
      margin: 24px 0 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      background-color: var(--card-bg);
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid var(--border);
    }
    th, td {
      padding: 10px 14px;
      text-align: left;
      font-size: 13px;
      border-bottom: 1px solid var(--border);
    }
    th { background-color: #162032; color: var(--text-muted); }
    .empty-state {
      padding: 16px;
      text-align: center;
      color: var(--text-muted);
      font-size: 13px;
    }
    .badge-warn { color: var(--warning); }
    .badge-err { color: var(--danger); font-weight: bold; }
  </style>
</head>
<body>

  <div class="header">
    <h2 style="margin: 0;">NiFi 流程即時監控</h2>
    <div>
      <span id="connectionStatus" class="status-badge status-offline">連線檢查中...</span>
      <span id="lastUpdated" style="font-size: 13px; color: var(--text-muted); margin-left: 12px;"></span>
    </div>
  </div>

  <div class="actions-bar">
    <button class="btn btn-primary" onclick="copyCurrentJson()">📋 複製完整 JSON (餵給 AI / Debug)</button>
    <button class="btn" onclick="fetchData()">🔄 手動整理</button>
  </div>

  <!-- KPI 區塊：已整合 controller_status + aggregateSnapshot -->
  <div class="grid-kpi">
    <div class="card">
      <div class="card-title">總連線數 (Connections)</div>
      <div class="card-value" id="kpiConnections">-</div>
    </div>
    <div class="card">
      <div class="card-title">佇列 FlowFiles (Queued)</div>
      <div class="card-value" id="kpiQueuedFiles">-</div>
    </div>
    <div class="card">
      <div class="card-title">執行中 (Running)</div>
      <div class="card-value" id="kpiRunning">-</div>
    </div>
    <div class="card">
      <div class="card-title">已停止 (Stopped)</div>
      <div class="card-value" id="kpiStopped">-</div>
    </div>
    <div class="card">
      <div class="card-title">有效執行緒 (Active Threads)</div>
      <div class="card-value" id="kpiThreads">-</div>
    </div>
    <div class="card">
      <div class="card-title">異常元件數 (Invalid)</div>
      <div class="card-value" id="kpiInvalid">-</div>
    </div>
  </div>

  <!-- 壅塞連線監控 (Bottlenecks) -->
  <div class="section-title">🚨 壅塞 / 佇列積壓連線 (Bottlenecks)</div>
  <table>
    <thead>
      <tr>
        <th>連線名稱</th>
        <th>來源端</th>
        <th>目的端</th>
        <th>積壓數量</th>
        <th>容量使用率</th>
      </tr>
    </thead>
    <tbody id="bottlenecksBody"></tbody>
  </table>

  <!-- 無效處理器清單 -->
  <div class="section-title">⚠️ 無效處理器 (Invalid Processors)</div>
  <table>
    <thead>
      <tr>
        <th>名稱</th>
        <th>狀態</th>
        <th>類型</th>
        <th>驗證錯誤原因</th>
      </tr>
    </thead>
    <tbody id="invalidProcessorsBody"></tbody>
  </table>

  <!-- 系統告警日誌 (Bulletins) -->
  <div class="section-title">📜 即時 Bulletin 告警通知</div>
  <table>
    <thead>
      <tr>
        <th>層級</th>
        <th>節點 / 元件</th>
        <th>訊息內容</th>
      </tr>
    </thead>
    <tbody id="bulletinsBody"></tbody>
  </table>

  <script>
    const FIREBASE_URL = "https://nifi-d2de1-default-rtdb.firebaseio.com/nifi_monitor.json";
    let latestData = null;

    function setConnectionStatus(isOnline, message) {
      const el = document.getElementById("connectionStatus");
      if (!el) return;
      el.className = `status-badge ${isOnline ? "status-online" : "status-offline"}`;
      el.textContent = message;
    }

    function copyCurrentJson() {
      if (!latestData) {
        alert("尚無可複製的資料！");
        return;
      }
      navigator.clipboard.writeText(JSON.stringify(latestData, null, 2))
        .then(() => alert("已複製即時 JSON 到剪貼簿！可直接貼給 AI 分析。"))
        .catch(err => console.error("複製失敗", err));
    }

    function renderDashboard(data) {
      if (!data) return;
      latestData = data;

      // 1. KPI 讀取與計算
      const kpi = data.kpi || {};
      const ctrl = data.controller_status || {};

      let totalConnections = data.total_connections;
      if (totalConnections === undefined && Array.isArray(data.process_groups_summary)) {
        totalConnections = data.process_groups_summary.reduce((acc, pg) => acc + (pg.connection_count || 0), 0);
      }
      document.getElementById("kpiConnections").textContent = totalConnections ?? "-";
      document.getElementById("kpiQueuedFiles").textContent = kpi.flowFilesQueued ?? 0;
      
      // 從 controller_status 讀取 running / stopped
      document.getElementById("kpiRunning").textContent = ctrl.runningCount ?? "-";
      document.getElementById("kpiStopped").textContent = ctrl.stoppedCount ?? "-";
      document.getElementById("kpiThreads").textContent = kpi.activeThreadCount ?? 0;
      
      const invalidCount = kpi.invalidComponentCount || (data.invalid_processors ? data.invalid_processors.length : 0);
      const invalidEl = document.getElementById("kpiInvalid");
      invalidEl.textContent = invalidCount;
      invalidEl.style.color = invalidCount > 0 ? "var(--danger)" : "inherit";

      document.getElementById("lastUpdated").textContent = `最後同步：${data.timestamp ? new Date(data.timestamp).toLocaleTimeString() : new Date().toLocaleTimeString()}`;

      // 2. 渲染壅塞連線 (Bottlenecks)
      const bottlenecksBody = document.getElementById("bottlenecksBody");
      const bottlenecks = data.bottlenecks || [];
      if (bottlenecks.length === 0) {
        bottlenecksBody.innerHTML = `<tr><td colspan="5" class="empty-state">目前無積壓或達到背壓門檻的連線。</td></tr>`;
      } else {
        bottlenecksBody.innerHTML = bottlenecks.map(b => `
          <tr>
            <td><strong>${b.connection_name || b.connection_id}</strong></td>
            <td>${b.source_name || "-"}</td>
            <td>${b.destination_name || "-"}</td>
            <td><span class="badge-err">${b.queued_count}</span> (${b.queued_size || "0 B"})</td>
            <td>${b.percent_use_count ?? 0}%</td>
          </tr>
        `).join("");
      }

      // 3. 渲染無效處理器 (Invalid Processors)
      const invalidBody = document.getElementById("invalidProcessorsBody");
      const invalidList = data.invalid_processors || [];
      if (invalidList.length === 0) {
        invalidBody.innerHTML = `<tr><td colspan="4" class="empty-state">目前無任何異常或無效處理器。</td></tr>`;
      } else {
        invalidBody.innerHTML = invalidList.map(p => `
          <tr>
            <td><strong style="color: var(--danger);">${p.name || p.processor_id}</strong></td>
            <td>${p.state || "-"}</td>
            <td>${p.type || "-"}</td>
            <td>${(p.validation_errors || []).join("<br>") || "驗證失敗"}</td>
          </tr>
        `).join("");
      }

      // 4. 渲染告警日誌 (Bulletins)
      const bulletinsBody = document.getElementById("bulletinsBody");
      const bulletins = data.bulletins || [];
      if (bulletins.length === 0) {
        bulletinsBody.innerHTML = `<tr><td colspan="3" class="empty-state">目前無即時警告或錯誤告警。</td></tr>`;
      } else {
        bulletinsBody.innerHTML = bulletins.slice(0, 10).map(b => {
          const item = b.bulletin || {};
          const isErr = item.level === "ERROR";
          return `
            <tr>
              <td><span class="${isErr ? 'badge-err' : 'badge-warn'}">${item.level || "INFO"}</span></td>
              <td>${item.sourceName || item.sourceId || "-"}</td>
              <td>${item.message || "-"}</td>
            </tr>
          `;
        }).join("");
      }
    }

    async function fetchData() {
      try {
        const res = await fetch(FIREBASE_URL);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        setConnectionStatus(true, "連線正常");
        renderDashboard(data);
      } catch (err) {
        setConnectionStatus(false, "連線失敗");
        console.error("Fetch error:", err);
      }
    }

    // 啟動與定期輪詢
    fetchData();
    setInterval(fetchData, 5000);
  </script>
</body>
</html>
