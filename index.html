<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>NiFi 管線即時監控面板</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    :root {
      --bg: #0f172a; --panel: #1e293b; --border: #334155;
      --text: #f8fafc; --text-sub: #94a3b8;
      --accent: #38bdf8; --success: #22c55e; --warning: #f59e0b; --danger: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace; }
    body { background: var(--bg); color: var(--text); padding: 20px; font-size: 14px; }
    
    /* 頂部導覽列 */
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid var(--border); padding-bottom: 15px; }
    .title-group { display: flex; align-items: center; gap: 12px; }
    .pulse-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--success); animation: pulse 2s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.4; transform: scale(1.2); } }
    .status-badge { background: #14532d; color: #4ade80; padding: 4px 10px; border-radius: 20px; font-weight: bold; font-size: 12px; }

    /* KPI 卡片 */
    .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 24px; }
    .kpi-card { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 16px; }
    .kpi-label { color: var(--text-sub); font-size: 12px; margin-bottom: 8px; }
    .kpi-value { font-size: 24px; font-weight: 700; color: var(--accent); transition: color 0.3s ease; }
    .kpi-alert { color: var(--danger) !important; }

    /* 雙欄主控區 */
    .dashboard-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 16px; display: flex; flex-direction: column; height: 600px; }
    .panel-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; font-weight: bold; border-bottom: 1px solid var(--border); padding-bottom: 8px; }

    /* 錯誤事件清單 */
    .bulletin-list { overflow-y: auto; flex: 1; display: flex; flex-direction: column; gap: 8px; }
    .bulletin-item { background: #0f172a; border-left: 4px solid var(--warning); padding: 10px; border-radius: 4px; cursor: pointer; transition: all 0.2s; }
    .bulletin-item:hover { background: #26334d; }
    .bulletin-item.error { border-left-color: var(--danger); }
    .bulletin-item.active { outline: 1px solid var(--accent); background: #1e3a5f; }
    .bulletin-meta { font-size: 11px; color: var(--text-sub); display: flex; justify-content: space-between; margin-bottom: 4px; }

    /* JSON 檢視器 */
    .json-viewer-container { display: flex; flex-direction: column; flex: 1; overflow: hidden; }
    .action-bar { display: flex; justify-content: space-between; margin-bottom: 8px; }
    .btn { background: #334155; border: none; color: #fff; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 12px; }
    .btn:hover { background: #475569; }
    .json-code { flex: 1; background: #0b1120; border: 1px solid var(--border); border-radius: 4px; padding: 12px; overflow: auto; color: #38bdf8; font-family: "Courier New", Courier, monospace; font-size: 12px; white-space: pre-wrap; word-break: break-all; }
  </style>
</head>
<body>

  <header>
    <div class="title-group">
      <div class="pulse-dot" id="pulseDot"></div>
      <h2>NiFi 管線狀態即時監控</h2>
      <span class="status-badge" id="systemStatus">連線中...</span>
    </div>
    <div style="font-size: 12px; color: var(--text-sub);">
      最後同步：<span id="lastUpdated">-</span> | 倒數：<span id="countdown">--</span> 秒
    </div>
  </header>

  <!-- 4 大端點 KPI 彙整 -->
  <div class="kpi-grid">
    <div class="kpi-card">
      <div class="kpi-label">活躍執行緒 (Threads)</div>
      <div class="kpi-value" id="kpiThreads">0</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-label">連線佇列滯留 (Queued)</div>
      <div class="kpi-value" id="kpiQueued">0</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-label">資料吞吐量 (Bytes)</div>
      <div class="kpi-value" id="kpiThroughput">0 B</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-label">未排除告警 (Bulletins)</div>
      <div class="kpi-value" id="kpiBulletins">0</div>
    </div>
  </div>

  <!-- 主要診斷視圖 -->
  <div class="dashboard-grid">
    <!-- 左側：Bulletin 告警時間軸 (端點 3) -->
    <div class="panel">
      <div class="panel-header">
        <span>異常事件時間軸 (Bulletin Board)</span>
        <span style="font-size: 12px; color: var(--text-sub);" id="bulletinCount">共 0 則</span>
      </div>
      <div class="bulletin-list" id="bulletinList">
        <div style="color: var(--text-sub); text-align: center; margin-top: 40px;">目前管線運行正常，無異常警告</div>
      </div>
    </div>

    <!-- 右側：錯誤與原始 JSON 檢視器 -->
    <div class="panel">
      <div class="panel-header">
        <span>結構化 JSON 診斷器</span>
        <div class="action-bar">
          <button class="btn" onclick="copyCurrentJSON()">複製 JSON</button>
        </div>
      </div>
      <div class="json-viewer-container">
        <div id="jsonSummary" style="font-size: 12px; color: #f59e0b; margin-bottom: 6px;">點選左側事件可快速定位問題</div>
        <pre class="json-code" id="jsonDisplay">/* 等待載入資料... */</pre>
      </div>
    </div>
  </div>

  <script>
    // ⚙️ 請替換為你的 GIST_ID 與 檔案名稱
    const GIST_ID = "xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx";
    const GIST_FILENAME = "nifi_monitor.json";
    
    // Gist API 端點 (直接讀取，完全無 GitHub 靜態 CDN 快取延遲)
    const GIST_API_URL = `https://api.github.com/gists/${GIST_ID}`;
    
    const POLL_INTERVAL = 5; // 前端輪詢頻率 (秒)
    let countdownSec = POLL_INTERVAL;
    let fullSnapshot = null;

    async function fetchLatestData() {
      try {
        const resp = await fetch(`${GIST_API_URL}?_t=${Date.now()}`);
        if (!resp.ok) throw new Error("Gist 讀取失敗");
        const gistData = await resp.json();
        
        if (gistData.files && gistData.files[GIST_FILENAME]) {
          fullSnapshot = JSON.parse(gistData.files[GIST_FILENAME].content);
          renderDashboard(fullSnapshot);
        }
      } catch (err) {
        document.getElementById('systemStatus').textContent = "同步中斷";
        document.getElementById('systemStatus').style.background = "#7f1d1d";
        document.getElementById('pulseDot').style.background = "var(--danger)";
      }
    }

    function renderDashboard(data) {
      document.getElementById('systemStatus').textContent = data.status;
      document.getElementById('lastUpdated').textContent = data.timestamp;

      // 1. KPI 渲染
      const kpis = data.kpis;
      document.getElementById('kpiThreads').textContent = kpis.activeThreadCount;
      document.getElementById('kpiQueued').textContent = kpis.flowFilesQueued.toLocaleString();
      document.getElementById('kpiThroughput').textContent = (kpis.bytesRead + kpis.bytesWritten).toLocaleString() + " B";
      
      const bulletinElem = document.getElementById('kpiBulletins');
      bulletinElem.textContent = kpis.bulletinCount;
      if (kpis.bulletinCount > 0) {
        bulletinElem.classList.add('kpi-alert');
      } else {
        bulletinElem.classList.remove('kpi-alert');
      }

      // 2. Bulletin 列表渲染 (端點 3)
      const listContainer = document.getElementById('bulletinList');
      const bulletins = data.raw_endpoints.bulletins || [];
      document.getElementById('bulletinCount').textContent = `共 ${bulletins.length} 則`;

      if (bulletins.length === 0) {
        listContainer.innerHTML = '<div style="color: var(--text-sub); text-align: center; margin-top: 40px;">目前管線運行正常，無異常警告</div>';
        displayJSON(data.kpis, "目前無錯誤：展示全域指標快照");
      } else {
        listContainer.innerHTML = '';
        bulletins.forEach((b, idx) => {
          const item = document.createElement('div');
          const isError = (b.bulletin && b.bulletin.level === 'ERROR');
          item.className = `bulletin-item ${isError ? 'error' : ''}`;
          item.innerHTML = `
            <div class="bulletin-meta">
              <span><b>${b.bulletin ? b.bulletin.sourceName : '未知節點'}</b></span>
              <span>${b.bulletin ? b.bulletin.timestamp : ''}</span>
            </div>
            <div style="font-size: 12px;">${b.bulletin ? b.bulletin.message : '無詳細訊息'}</div>
          `;
          item.onclick = () => {
            document.querySelectorAll('.bulletin-item').forEach(el => el.classList.remove('active'));
            item.classList.add('active');
            displayJSON(b, `來源節點: ${b.bulletin ? b.bulletin.sourceId : ''}`);
          };
          listContainer.appendChild(item);
        });
      }
    }

    function displayJSON(obj, summaryText) {
      document.getElementById('jsonSummary').textContent = summaryText || "";
      document.getElementById('jsonDisplay').textContent = JSON.stringify(obj, null, 2);
    }

    function copyCurrentJSON() {
      const code = document.getElementById('jsonDisplay').textContent;
      navigator.clipboard.writeText(code).then(() => alert("JSON 已成功複製至剪貼簿！"));
    }

    // 啟動倒數計時與短輪詢
    setInterval(() => {
      countdownSec--;
      if (countdownSec <= 0) {
        countdownSec = POLL_INTERVAL;
        fetchLatestData();
      }
      document.getElementById('countdown').textContent = countdownSec;
    }, 1000);

    // 首次立即載入
    fetchLatestData();
  </script>
</body>
</html>
