<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Apache NiFi 即時監控儀表板</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
      --primary: #38bdf8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 24px; }
    .container { max-width: 1300px; margin: 0 auto; }

    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; padding-bottom: 16px; border-bottom: 1px solid var(--border); }
    .status-badge { display: inline-flex; align-items: center; gap: 8px; font-size: 0.9rem; padding: 6px 12px; border-radius: 9999px; background: #064e3b; color: #6ee7b7; }
    .status-badge.offline { background: #7f1d1d; color: #fca5a5; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background-color: currentColor; }

    .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; margin-bottom: 24px; }
    .kpi-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 10px; padding: 18px; }
    .kpi-label { font-size: 0.8rem; color: var(--text-muted); margin-bottom: 6px; }
    .kpi-value { font-size: 1.6rem; font-weight: 700; color: var(--primary); }
    .kpi-value.alert { color: var(--danger); }
    .kpi-value.warn { color: var(--warning); }

    .section-title { font-size: 1.1rem; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
    .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 10px; padding: 20px; margin-bottom: 24px; }

    table { width: 100%; border-collapse: collapse; text-align: left; font-size: 0.9rem; }
    th { color: var(--text-muted); padding: 10px; border-bottom: 1px solid var(--border); }
    td { padding: 10px; border-bottom: 1px solid var(--border); vertical-align: top; }
    .empty-msg { color: var(--text-muted); font-size: 0.9rem; text-align: center; padding: 16px 0; }
    .badge { padding: 2px 8px; border-radius: 4px; font-size: 0.75rem; font-weight: 600; display: inline-block; }
    .badge-danger { background: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid #ef4444; }
    .badge-warn { background: rgba(245, 158, 11, 0.2); color: #fbbf24; border: 1px solid #f59e0b; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div>
        <h1>Apache NiFi 叢集即時監控</h1>
        <p style="color: var(--text-muted); font-size: 0.85rem; margin-top: 4px;">資料來源：Firebase Realtime Database</p>
      </div>
      <div id="connStatus" class="status-badge offline">
        <span class="dot"></span>
        <span id="connText">連線中...</span>
      </div>
    </header>

    <!-- KPI 統計 -->
    <div class="kpi-grid">
      <div class="kpi-card">
        <div class="kpi-label">Active Threads</div>
        <div id="kpi-threads" class="kpi-value">0</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">Queued FlowFiles</div>
        <div id="kpi-queued" class="kpi-value">0</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">Queued Data Size</div>
        <div id="kpi-bytesQueued" class="kpi-value">0 B</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">Invalid Components</div>
        <div id="kpi-invalid" class="kpi-value">0</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">Errors</div>
        <div id="kpi-errors" class="kpi-value">0</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">Warnings</div>
        <div id="kpi-warnings" class="kpi-value">0</div>
      </div>
    </div>

    <!-- 瓶頸連線 (Bottlenecks) -->
    <div class="card">
      <h2 class="section-title">🚨 積壓與背壓瓶頸連線 (Bottlenecks)</h2>
      <div id="bottlenecksContainer">
        <p class="empty-msg">佇列正常，無背壓或堵塞連線</p>
      </div>
    </div>

    <!-- 異常 Processor 清單 -->
    <div class="card">
      <h2 class="section-title">⚠️ 驗證失敗 / 停止中元件 (Invalid Processors)</h2>
      <div id="invalidContainer">
        <p class="empty-msg">所有元件運作正常 (Valid)</p>
      </div>
    </div>
  </div>

  <script>
    const FIREBASE_URL = "https://nifi-d2de1-default-rtdb.firebaseio.com/nifi_monitor.json";

    function formatBytes(bytes) {
      if (!bytes || bytes === 0) return "0 B";
      const k = 1024;
      const sizes = ["B", "KB", "MB", "GB", "TB"];
      const i = Math.floor(Math.log(bytes) / Math.log(k));
      return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + " " + sizes[i];
    }

    async function refreshMonitor() {
      try {
        const response = await fetch(FIREBASE_URL);
        if (!response.ok) throw new Error(HTTP ${response.status});
        const data = await response.json();

        if (!data) {
          setConnectionStatus(false, "資料庫節點尚無資料");
          return;
        }

        renderDashboard(data);
        setConnectionStatus(true, 最後更新: ${new Date(data.timestamp).toLocaleTimeString()});
      } catch (err) {
        setConnectionStatus(false, "無法連線至 Firebase");
        console.error(err);
      }
    }

    function setConnectionStatus(isOnline, text) {
      const badge = document.getElementById("connStatus");
      const label = document.getElementById("connText");
      label.innerText = text;
      if (isOnline) {
        badge.className = "status-badge";
      } else {
        badge.className = "status-badge offline";
      }
    }

    function renderDashboard(data) {
      const kpi = data.kpi || {};
      document.getElementById("kpi-threads").innerText = kpi.activeThreadCount || 0;
      document.getElementById("kpi-queued").innerText = (kpi.flowFilesQueued || 0).toLocaleString();
      document.getElementById("kpi-bytesQueued").innerText = formatBytes(kpi.bytesQueued);

      const invalidEl = document.getElementById("kpi-invalid");
      invalidEl.innerText = kpi.invalidComponentCount || 0;
      invalidEl.className = "kpi-value" + ((kpi.invalidComponentCount || 0) > 0 ? " alert" : "");

      const errEl = document.getElementById("kpi-errors");
      errEl.innerText = kpi.errorCount || 0;
      errEl.className = "kpi-value" + ((kpi.errorCount || 0) > 0 ? " alert" : "");

      const warnEl = document.getElementById("kpi-warnings");
      warnEl.innerText = kpi.warningCount || 0;
      warnEl.className = "kpi-value" + ((kpi.warningCount || 0) > 0 ? " warn" : "");

      // 渲染 Bottlenecks
      const bContainer = document.getElementById("bottlenecksContainer");
      if (data.bottlenecks && data.bottlenecks.length > 0) {
        let html = `<table>
          <thead>
            <tr>
              <th>連線名稱</th>
              <th>來源元件</th>
              <th>目標元件</th>
              <th>積壓數量</th>
              <th>積壓體積</th>
              <th>背壓使用率 (數量/容量)</th>
            </tr>
          </thead>
          <tbody>`;
        data.bottlenecks.forEach(b => {
          html += `<tr>
            <td><strong>${b.connection_name || b.connection_id}</strong></td>
            <td>${b.source_name || "-"}</td>
            <td>${b.destination_name || "-"}</td>
            <td><span class="badge badge-warn">${b.queued_count}</span></td>
            <td>${b.queued_size || "-"}</td>
            <td>${b.percent_use_count}% / ${b.percent_use_bytes}%</td>
          </tr>`;
        });
        html += </tbody></table>;
        bContainer.innerHTML = html;
      } else {
        bContainer.innerHTML = <p class="empty-msg">佇列正常，無背壓或堵塞連線</p>;
      }

      // 渲染 Invalid Processors
      const pContainer = document.getElementById("invalidContainer");
      if (data.invalid_processors && data.invalid_processors.length > 0) {
        let html = `<table>
          <thead>
            <tr>
              <th>Processor 名稱</th>
              <th>類型</th>
              <th>狀態</th>
              <th>驗證錯誤內容</th>
            </tr>
          </thead>
          <tbody>`;
        data.invalid_processors.forEach(p => {
          const errors = (p.validation_errors || []).join("<br>");
          html += `<tr>
            <td><strong>${p.name}</strong></td>
            <td>${p.type.split('.').pop()}</td>
            <td><span class="badge badge-danger">${p.validation_status}</span></td>
            <td style="color: #fca5a5; font-size: 0.8rem;">${errors || "無具體說明"}</td>
          </tr>`;
        });
        html += </tbody></table>;
        pContainer.innerHTML = html;
      } else {
        pContainer.innerHTML = <p class="empty-msg">所有元件運作正常 (Valid)</p>;
      }
    }

    // 每 3 秒拉取一次
    setInterval(refreshMonitor, 3000);
    refreshMonitor();
  </script>
</body>
</html>
